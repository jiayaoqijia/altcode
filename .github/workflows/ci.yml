name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: go build -mod=mod ./...

      - name: Test
        run: go test -mod=mod ./... -race -count=1 -timeout=180s -parallel=8

      - name: Vet
        run: go vet -mod=mod ./...

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Binary size check
        run: |
          go build -mod=mod -ldflags="-s -w" -trimpath -o /tmp/altcode ./cmd/altcode
          SIZE=$(stat -c%s /tmp/altcode)
          echo "Binary size: $((SIZE / 1024 / 1024))MB ($SIZE bytes)"
          # Budget: 26 packages, 13 providers, MCP, workflow orchestrator,
          # skills, hooks, sandbox, scm, store — grown from 10MB baseline.
          # 25MB ceiling keeps us honest without blocking active development.
          if [ "$SIZE" -gt 26214400 ]; then
            echo "FAIL: Binary exceeds 25MB"
            exit 1
          fi

      - name: Test count
        run: |
          COUNT=$(go test -mod=mod ./... -v -count=1 -timeout=180s 2>&1 | grep -cF -- '--- PASS')
          echo "Tests passing: $COUNT"
          if [ "$COUNT" -lt 300 ]; then
            echo "FAIL: Expected 300+ tests, got $COUNT"
            exit 1
          fi
