name: CI

on:
  pull_request:
    branches: [main]
    paths: ['**.go', 'go.mod', 'go.sum']

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build + Vet
        run: |
          go build -mod=mod ./cmd/altcode/...
          go vet -mod=mod ./cmd/altcode/... ./internal/...

      - name: Smoke test
        run: go test -mod=mod -short -count=1 -timeout=60s ./internal/engine/... ./internal/daemon/... ./internal/tui/... ./internal/exec/...
