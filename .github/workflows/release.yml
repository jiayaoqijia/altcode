name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Pre-release sanity only — CI already ran the full race+vet suite
  # on the PR before merge, so the release job just confirms the
  # tagged SHA still builds and the 4 core packages still pass smoke
  # tests. ubuntu-only: multi-OS build sanity is covered by the
  # `build` matrix below, and running the test suite on macOS/Windows
  # at tag time was pure duplication of merged CI.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build + Vet
        run: |
          go build -mod=mod ./cmd/altcode/...
          go vet -mod=mod ./cmd/altcode/... ./internal/...

      - name: Smoke test
        run: go test -mod=mod -short -count=1 -timeout=60s ./internal/engine/... ./internal/daemon/... ./internal/tui/... ./internal/exec/...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOFLAGS: -mod=mod
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            -o "altcode-${GOOS}-${GOARCH}${EXT}" ./cmd/altcode

      - uses: actions/upload-artifact@v4
        with:
          name: altcode-${{ matrix.goos }}-${{ matrix.goarch }}
          path: altcode-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: altcode-*
          generate_release_notes: true
