{{define "content"}}
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
  <h1 class="text-xl font-bold">Dashboard</h1>
  <a href="{{absPath "/ui/tasks/new"}}" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors" style="text-decoration:none">
    New Task
  </a>
</div>

<div hx-get="{{absPath "/ui/partials/kpi-cards"}}" hx-trigger="every 30s" hx-swap="innerHTML">
  {{template "kpi_cards" .Content}}
</div>

<div style="display:flex;gap:8px;margin-bottom:12px">
  <a href="{{absPath "/ui/"}}" class="text-sm font-medium px-3 py-1 rounded-md {{if not .Content.StatusFilter}}bg-blue-100 text-blue-800{{else}}bg-gray-100 text-gray-600 hover:bg-gray-200{{end}}" style="text-decoration:none">All</a>
  <a href="{{absPath "/ui/"}}?status=active" class="text-sm font-medium px-3 py-1 rounded-md {{if eq .Content.StatusFilter "active"}}bg-blue-100 text-blue-800{{else}}bg-gray-100 text-gray-600 hover:bg-gray-200{{end}}" style="text-decoration:none">Active</a>
  <a href="{{absPath "/ui/"}}?status=completed" class="text-sm font-medium px-3 py-1 rounded-md {{if eq .Content.StatusFilter "completed"}}bg-blue-100 text-blue-800{{else}}bg-gray-100 text-gray-600 hover:bg-gray-200{{end}}" style="text-decoration:none">Completed</a>
  <a href="{{absPath "/ui/"}}?status=failed" class="text-sm font-medium px-3 py-1 rounded-md {{if eq .Content.StatusFilter "failed"}}bg-blue-100 text-blue-800{{else}}bg-gray-100 text-gray-600 hover:bg-gray-200{{end}}" style="text-decoration:none">Failed</a>
</div>

<div hx-get="{{absPath "/ui/partials/task-list"}}{{if .Content.StatusFilter}}?status={{.Content.StatusFilter}}{{end}}" hx-trigger="every 5s" hx-swap="innerHTML">
  {{template "task_list" .Content}}
</div>
{{end}}
