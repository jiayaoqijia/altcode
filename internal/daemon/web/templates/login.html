{{define "content"}}
<div class="flex justify-center items-center" style="min-height: 60vh">
  <div class="card p-8 max-w-sm w-full text-center rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-2">AltFix Control Plane</h1>
    <p class="text-gray-500 mb-6">Sign in to continue</p>

    {{if .Content}}
      {{with .Content}}
        {{if index . "Error"}}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4 text-sm">
          {{index . "Error"}}
        </div>
        {{end}}
      {{end}}
    {{end}}

    <a href="{{absPath "/auth/github"}}"
       class="inline-flex items-center gap-2 bg-gray-800 hover:bg-gray-700 text-white px-5 py-2.5 rounded-md font-medium transition-colors">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 0C4.477 0 0 4.477 0 10c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0110 4.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C17.138 18.163 20 14.418 20 10c0-5.523-4.477-10-10-10z" clip-rule="evenodd"/>
      </svg>
      Sign in with GitHub
    </a>

    <p class="text-gray-400 text-xs mt-6">
      Access restricted to authorized users and organizations.
    </p>
  </div>
</div>
{{end}}
